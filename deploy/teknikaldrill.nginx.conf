# Berkas contoh vhost TeknikalDrill.
# install.sh menyalinnya ke /etc/nginx/sites-available/teknikaldrill lalu
# mengganti DOMAIN_PLACEHOLDER dengan nama host yang dipakai.
#
# Dua hal yang menentukan aplikasinya bekerja sebagai PWA atau tidak:
#   1. HTTPS wajib — service worker hanya hidup di https dan localhost
#   2. sw.js tidak boleh di-cache lama — kalau di-cache, pembaruan tidak
#      pernah sampai ke perangkat yang sudah memasang aplikasinya

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # certbot menaruh berkas pembuktian di sini saat memperbarui sertifikat,
    # jadi lokasi ini harus tetap dilayani lewat http biasa
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Bentuk direktif http2 berbeda antar versi nginx, jadi dua baris berikut
    # ditulis oleh install.sh sesuai versi yang terpasang:
    #   nginx >= 1.25.1  -> "listen 443 ssl;" ditambah "http2 on;"
    #   nginx <  1.25.1  -> "listen 443 ssl http2;" tanpa baris http2 terpisah
    LISTEN443_PLACEHOLDER
    LISTEN443_V6_PLACEHOLDER
    HTTP2_PLACEHOLDER
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/teknikaldrill;
    index index.html;

    charset utf-8;

    # --- header keamanan dasar ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- service worker: selalu diperiksa ulang ---
    # Tanpa ini, perangkat yang sudah memasang aplikasinya akan terus memakai
    # service worker lama dan tidak pernah tahu ada versi baru.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html juga jangan di-cache lama: dari sinilah daftar berkas
    # yang dipracache service worker dibaca.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- sisanya aman di-cache lama ---
    # Versi cache service worker diturunkan dari isi berkas, jadi setiap
    # perubahan isi menghasilkan cache baru dan yang lama dibuang sendiri.
    # Folder kerja yang tidak perlu disajikan ke publik. Blok ini WAJIB berada
    # di atas blok pencocokan ekstensi berkas di bawahnya: nginx memakai
    # location regex yang PERTAMA cocok, sehingga kalau urutannya dibalik,
    # /tools/validate.js akan tertangkap aturan ".js" dan tetap tersaji.
    location ~ ^/(tools|\.git|deploy)/ {
        deny all;
    }

    # Catatan: jangan pakai direktif "expires" di sini. Ia menulis header
    # Cache-Control sendiri, sehingga tanggapannya membawa dua Cache-Control
    # sekaligus dan sebagian perantara memperlakukannya secara tidak menentu.
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Permintaan navigasi ke alamat yang tidak ada dikembalikan ke index.html
    # supaya pintasan mode (?mode=...) dan pembukaan dari layar utama bekerja.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    access_log /var/log/nginx/teknikaldrill.access.log;
    error_log  /var/log/nginx/teknikaldrill.error.log;
}
